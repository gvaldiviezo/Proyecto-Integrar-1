<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Secreto de la Ciudad</title>
    <link rel="stylesheet" href="../assets/styles/style.css">
    <link rel="stylesheet" href="../assets/styles/mapaSecreto.css">
</head>
<body>
      <header class="body-mapa-secreto">
        <div class="logo">
            <a href="../index.html">📍 Mapa Secreto</a>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html" class="active">Inicio</a></li>
                <li><a href="explorar.html">Explorar Lugares</a></li>
                <li><a href="guardados.html">Mis Guardados</a></li>
                <li><a href="mapaSecreto.html" class="active">Mapa Secreto</a></li>

            </ul>
        </nav>
    </header>
<main class="mapa-layout">

  <section
    id="mapa"
    class="mapa"
    aria-label="Mapa secreto interactivo"
  >

    <img
      src="../assets/img/ciudadSecreta.png"
      alt="Mapa cyberpunk de Buenos Aires"
      class="mapa-img"
    >
    <div class="linterna"></div>

    <button
      class="pin"
      aria-label="Abrir información sobre Café Fantasma"
      data-title="Café Fantasma"
      data-description="Un café escondido ideal para estudiar de noche por su ambiente silencioso y luz tenue."
    ></button>
    <button
      class="pin"
      aria-label="Abrir información sobre Pasaje Neon"
      data-title="Pasaje Neon"
      data-description="Pasaje urbano perfecto para fotografía callejera y exploración nocturna."
    ></button>
    <button
      class="pin"
      aria-label="Abrir información sobre Biblioteca Subterránea"
      data-title="Biblioteca Subterránea"
      data-description="Librería escondida bajo una galería histórica con espacios íntimos para leer."
    ></button>
    <button
      class="pin"
      aria-label="Abrir información sobre Azotea 404"
      data-title="Azotea 404"
      data-description="Terraza secreta con vista panorámica y ambiente relajado."
    ></button>
    <button
      class="pin"
      aria-label="Abrir información sobre El Sótano"
      data-title="El Sótano"
      data-description="Espacio tecnológico oculto entre edificios antiguos y calles silenciosas."
    ></button>
    <button
      class="pin"
      aria-label="Abrir información sobre Mural Interactivo"
      data-title="Mural Interactivo"
      data-description="Zona artística llena de luces, grafitis y estética cyberpunk."
    ></button>
    <button
      class="pin"
      aria-label="Abrir información sobre Refugio Nocturno"
      data-title="Refugio Nocturno"
      data-description="Pequeño rincón urbano ideal para desconectarse del ruido de la ciudad."
    ></button>
    <button
      class="pin"
      aria-label="Abrir información sobre Nodo Clandestino"
      data-title="Nodo Clandestino"
      data-description="Zona secreta inspirada en tecnología futurista y arquitectura industrial."
    ></button>
  </section>


  <aside
    class="panel"
    aria-live="polite"
  >
    <h2 id="panel-title">
      Explorá el mapa
    </h2>

    <p id="panel-content">
      Mové la linterna sobre el mapa para descubrir lugares ocultos.
    </p>
  </aside>

</main>

<script src="../assets/js/mapaSecreto.js"></script>
 


 <footer>
        <p>&copy; 2026 Mapa Secreto de la Ciudad. Proyecto Integrador - Módulo Web Estática.</p>
        <p>Desarrollado por el grupo 14</p>
    </footer>

    <script src="../assets/js/mapaSecreto.js"></script>
</body>
</html>
