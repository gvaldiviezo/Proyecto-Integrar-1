<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Secreto de la Ciudad</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icon/logo.png">
    <link rel="stylesheet" href="../assets/styles/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">📍 Mapa Secreto</a>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="explorar.html" class="active">Explorar Lugares</a></li>
                <li><a href="guardados.html">Mis Guardados</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="busqueda-container">
            <h1>Explorar Lugares</h1>
            <form class="filtros-busqueda" aria-label="Formulario de búsqueda de lugares">
                <fieldset>
                    <legend>Buscar por nombre</legend>
                    <input 
                        type="text" 
                        id="inputNombre" 
                        placeholder="Escribe el nombre del lugar..." 
                        aria-label="Buscar por nombre"
                        class="input-busqueda"
                    >
                </fieldset>

                <fieldset>
                    <legend>Filtrar por zona</legend>
                    <select id="selectZona" aria-label="Selecciona una zona">
                        <option value="">Todas las zonas</option>
                        <option value="Centro">Centro</option>
                        <option value="Zona Norte">Zona Norte</option>
                        <option value="Barrio Antiguo">Barrio Antiguo</option>
                        <option value="Zona Este">Zona Este</option>
                        <option value="Zona Oeste">Zona Oeste</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Filtrar por temática</legend>
                    <div class="tematica-options">
                        <label>
                            <input type="radio" name="tematica" value="Al aire libre"> Al aire libre
                        </label>
                        <label>
                            <input type="radio" name="tematica" value="Librería"> Librería
                        </label>
                        <label>
                            <input type="radio" name="tematica" value="Café"> Café
                        </label>
                        <label>
                            <input type="radio" name="tematica" value="Merienda"> Merienda
                        </label>
                        <label>
                            <input type="radio" name="tematica" value="Paisaje"> Paisaje
                        </label>
                        <label>
                            <input type="radio" name="tematica" value="Histórico"> Histórico
                        </label>
                        <label>
                            <input type="radio" name="tematica" value="Gastronomía"> Gastronomía
                        </label>
                    </div>
                </fieldset>

                <button type="reset" class="btn-limpiar" aria-label="Limpiar filtros">Limpiar filtros</button>
            </form>
        </section>

        <section class="lugares-container">
            <article class="lugar-card">
                <figure class="lugar-imagen">
                    <img src="" alt="" class="imagen">
                </figure>
                <header>
                    <h3 class="nombre"></h3>
                </header>
                <section class="lugar-info">
                    <address class="direccion"></address>
                    <p class="zona"></p>
                    <p class="tematica"></p>
                    <blockquote class="resena"></blockquote>
                </section>
                <section class="card-actions">
                    <button class="guardar-btn" aria-label="Guardar lugar">Guardar</button>
                </section>
            </article>
        </section>
    </main>


    <footer>
        <p>&copy; 2026 Mapa Secreto de la Ciudad. Proyecto Integrador - Módulo Web Estática.</p>
        <p>Desarrollado por el grupo 14</p>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/explorarLugares.js"></script>
</body>
</html>
